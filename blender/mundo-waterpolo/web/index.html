<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Mundo Waterpolo 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa; HUD flotante (barra superior, lista de vistas a la izquierda, ayuda abajo). Aspecto único oscuro de "sala de control" del club. */
:root {
  --noche: #0a1428;          /* fondo / azul marino del club */
  --panel: rgba(10, 20, 40, 0.84);
  --tinta: #e8eef7;
  --gris: #9db0c9;
  --balon: #f2c618;          /* amarillo balón de waterpolo */
  --linea: rgba(232, 238, 247, 0.14);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --texto: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--noche); color: var(--tinta); font-family: var(--texto); overflow: hidden; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: fixed; z-index: 5; }
.barra {
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; pointer-events: none;
}
.marca { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 10px;
  padding: 8px 14px; display: flex; flex-direction: column; gap: 1px; backdrop-filter: blur(8px); }
.marca small { font: 600 11px/1.2 var(--texto); letter-spacing: .12em; text-transform: uppercase; color: var(--balon); }
.marca h1 { margin: 0; font: 700 22px/1.05 var(--display); letter-spacing: .02em; text-wrap: balance; }
.modos { pointer-events: auto; margin-left: auto; display: flex; background: var(--panel); border: 1px solid var(--linea);
  border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); }
.modos button { font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gris);
  background: transparent; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.modos button[aria-pressed="true"] { background: var(--balon); color: var(--noche); }
.modos button:focus-visible, .vista:focus-visible, .plegar:focus-visible { outline: 2px solid var(--balon); outline-offset: 2px; }

.vistas {
  top: calc(86px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: 236px; max-height: calc(100% - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 12px;
  padding-block: 10px; backdrop-filter: blur(8px);
}
.vistas h2 { margin: 10px 14px 4px; font: 600 11px/1.2 var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--gris); }
.vistas h2:first-of-type { margin-top: 2px; }
.vista { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; background: none; border: 0;
  color: var(--tinta); font: 500 15px/1.25 var(--texto); padding: 7px 14px; cursor: pointer; }
.vista span { font: 600 12px/1 var(--display); color: var(--gris); min-width: 18px; font-variant-numeric: tabular-nums; }
.vista:hover { background: rgba(242, 198, 24, 0.08); }
.vista[aria-current="true"] { color: var(--balon); }
.vista[aria-current="true"] span { color: var(--balon); }
.plegar { display: none; }

.ayuda {
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--linea); border-radius: 999px; padding: 8px 16px;
  font: 500 13px/1.3 var(--texto); color: var(--gris); text-align: center; backdrop-filter: blur(8px);
}
.ayuda b { color: var(--tinta); font-weight: 600; }
.zona { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--balon);
  background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 7px 10px; }

#joy { position: fixed; z-index: 6; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--linea); background: rgba(10, 20, 40, 0.45); touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--balon); opacity: .85; }

#carga { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--noche); }
.carga-caja { width: min(360px, calc(100% - 48px)); display: grid; gap: 12px; }
.carga-caja h2 { margin: 0; font: 700 34px/1 var(--display); letter-spacing: .02em; }
.carga-caja p { margin: 0; color: var(--gris); font-size: 14px; line-height: 1.45; }
.carril { height: 6px; background: var(--linea); border-radius: 3px; overflow: hidden; }
.carril i { display: block; height: 100%; width: 0%; background: var(--balon); transition: width .2s; }
#estado { font: 600 13px/1 var(--display); letter-spacing: .08em; color: var(--balon); font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .marca h1 { font-size: 18px; }
  .vistas { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto;
    bottom: calc(104px + env(safe-area-inset-bottom, 0px)); max-height: 42%; }
  .vistas.plegada .lista { display: none; }
  .plegar { display: block; width: 100%; background: none; border: 0; color: var(--balon); font: 600 13px/1 var(--display);
    letter-spacing: .1em; text-transform: uppercase; padding: 4px 14px 8px; text-align: left; cursor: pointer; }
  .ayuda { border-radius: 10px; font-size: 12px; }
  .zona { display: none; }
}
@media (prefers-reduced-motion: reduce) { .carril i { transition: none; } }
</style>
</head>
<body>


<canvas id="lienzo" aria-label="Vista 3D del mundo de waterpolo"></canvas>

<div class="hud barra">
  <div class="marca"><small>Centro de alto rendimiento</small><h1>Mundo Waterpolo 3D</h1></div>
  <div class="modos" role="group" aria-label="Modo de cámara">
    <button id="m-orbitar" aria-pressed="true">Orbitar</button>
    <button id="m-caminar" aria-pressed="false">Caminar</button>
  </div>
</div>

<nav class="hud vistas plegada" id="vistas" aria-label="Vistas">
  <button class="plegar" id="plegar" aria-expanded="false">Vistas ▾</button>
  <div class="lista" id="lista"></div>
</nav>

<div class="hud ayuda" id="ayuda"></div>
<div class="zona" id="zona">Exterior</div>
<div id="joy" hidden><i></i></div>

<div id="carga">
  <div class="carga-caja">
    <h2>Mundo Waterpolo</h2>
    <p>Barrio europeo, gimnasio de alto rendimiento y centro de waterpolo con iluminación horneada en Cycles. La parcela del pool deck queda libre (56 × 36 m).</p>
    <div class="carril"><i id="barra"></i></div>
    <div id="estado">Cargando…</div>
  </div>
</div>

<script>
// errores visibles en pantalla (si algo falla, se ve el motivo en lugar de una carga infinita)
(function () {
  const msg = (t) => { const e = document.getElementById('estado'); if (e) e.textContent = t; };
  addEventListener('error', (e) => msg('Error: ' + (e.message || 'no se pudo cargar un recurso')));
  addEventListener('unhandledrejection', (e) => msg('Error: ' + ((e.reason && e.reason.message) || e.reason)));
  setTimeout(() => {
    const c = document.getElementById('carga');
    if (c && !c.hidden && !window.MW_PASO)
      msg('El visor no llegó a arrancar: este navegador bloqueó el JavaScript del archivo.');
  }, 20000);
})();
</script>
<script src="visor.bundle.js"></script>

</body>
</html>
